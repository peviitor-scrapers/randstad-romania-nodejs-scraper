name: Oportunitati SI Cariere

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          
      - name: Sync with remote
        if: github.event_name != 'pull_request'
        run: git pull origin main --rebase -X theirs

      - name: Install dependencies
        run: npm install

      - name: Ensure company exists in Solr company core
        run: |
          CIF=$(jq -r '.cif' config/company.json)
          LEGAL_NAME=$(jq -r '.legalName' config/company.json)
          BRAND=$(jq -r '.brand' config/company.json)
          WEBSITE=$(jq -r '.website' config/company.json)
          CAREER=$(jq -r '.careerUrl' config/company.json)
          DEFAULT_LOC=$(jq -r '.defaultLocation' config/company.json)
          SCRAPER_FILE=$(jq -r '.scraperFile' config/company.json)
          TODAY=$(date -u +%Y-%m-%d)

          CIF_PADDED=$(printf "%08d" "$CIF")

          # Migrated off direct-SOLR + SOLR_AUTH Basic Auth onto api.peviitor.ro,
          # same as the rest of the fleet. No credential needed.
          EXISTING=$(curl -s "https://api.peviitor.ro/v1/firme/company/?cif=${CIF_PADDED}" | jq '.data | length')

          echo "${BRAND} count in company core: $EXISTING"

          if [ "$EXISTING" -eq "0" ]; then
            echo "${BRAND} not found - adding to company core..."
            jq -n \
              --arg id "$CIF_PADDED" \
              --arg company "$LEGAL_NAME" \
              --arg brand "$BRAND" \
              --arg website "$WEBSITE" \
              --arg career "$CAREER" \
              --arg loc "$DEFAULT_LOC" \
              --arg today "$TODAY" \
              --arg scraperFile "$SCRAPER_FILE" \
              '{id:$id,company:$company,brand:$brand,status:"activ",location:[$loc],website:[$website],career:[$career],lastScraped:$today,scraperFile:$scraperFile}' \
              > company_data.json

            curl -s -X PUT "https://api.peviitor.ro/v1/firme/company/add/" \
              -H "Content-Type: application/json" \
              --data-binary @company_data.json
          else
            echo "${BRAND} already exists in company core - no action needed"
          fi

          FINAL=0
          # company/add commits within ~1s; retry so a brand-new company is not reported missing
          for attempt in 1 2 3 4 5 6; do
            FINAL=$(curl -s "https://api.peviitor.ro/v1/firme/company/?cif=${CIF_PADDED}" | jq '.data | length')
            [ "$FINAL" -ge "1" ] && break
            echo "waiting for company core commit (attempt $attempt)..."
            sleep 3
          done

          echo "${BRAND} count after check: $FINAL"

          if [ "$FINAL" -ge "1" ]; then
            echo "SUCCESS: ${BRAND} is in company core"
          else
            echo "FAILED: ${BRAND} still not in company core"
            exit 1
          fi

      - name: Pre-scrape — Unit Tests
        run: |
          npm run test:unit
          LEGAL_NAME=$(jq -r '.legalName' config/company.json)
          sed -i "s|<title>Test Report</title>|<title>Pre-scrape: Unit Tests — ${LEGAL_NAME}</title>|;s|<h1 id=\"title\">Test Report</h1>|<h1 id=\"title\">Pre-scrape: Unit Tests — ${LEGAL_NAME}</h1>|" test-report.html
          cp test-report.html docs/test-results/pre-scrape-unit.html || true

      - name: Pre-scrape — Integration Tests
        continue-on-error: true
        run: |
          npm run test:integration
          LEGAL_NAME=$(jq -r '.legalName' config/company.json)
          sed -i "s|<title>Test Report</title>|<title>Pre-scrape: Integration Tests — ${LEGAL_NAME}</title>|;s|<h1 id=\"title\">Test Report</h1>|<h1 id=\"title\">Pre-scrape: Integration Tests — ${LEGAL_NAME}</h1>|" test-report.html
          cp test-report.html docs/test-results/pre-scrape-integration.html || true

      - name: Run scraper
        run: npm run scrape
          
      - name: Check for new jobs
        run: |
          if [ -f tmp/jobs.json ]; then
            echo "New jobs found:"
            cat tmp/jobs.json | jq '.jobs | length'
          else
            echo "No new jobs or scrape failed"
          fi

      - name: Post-scrape — E2E Tests
        run: |
          npm run test:e2e
          LEGAL_NAME=$(jq -r '.legalName' config/company.json)
          sed -i "s|<title>Test Report</title>|<title>Post-scrape: E2E Tests — ${LEGAL_NAME}</title>|;s|<h1 id=\"title\">Test Report</h1>|<h1 id=\"title\">Post-scrape: E2E Tests — ${LEGAL_NAME}</h1>|" test-report.html
          cp test-report.html docs/test-results/post-scrape.html || true

      - name: Consistency Tests
        run: |
          npm run test:consistency
          LEGAL_NAME=$(jq -r '.legalName' config/company.json)
          sed -i "s|<title>Test Report</title>|<title>Post-scrape: Consistency Tests — ${LEGAL_NAME}</title>|;s|<h1 id=\"title\">Test Report</h1>|<h1 id=\"title\">Post-scrape: Consistency Tests — ${LEGAL_NAME}</h1>|" test-report.html
          cp test-report.html docs/test-results/post-scrape-consistency.html || true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: docs/test-results/
          retention-days: 30

      - name: Push test results to docs/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/test-results
          git add docs/test-results/
          git add docs/jobs.md || true
          git commit -m "[skip ci] Update test results" || echo "No changes to commit"
          git push || echo "Push failed (race condition) — will be picked up next run"
          
      - name: Upload jobs JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraped-jobs
          path: |
            tmp/jobs.json
            tmp/jobs_existing.json
          retention-days: 7
